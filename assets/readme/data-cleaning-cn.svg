<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="690" viewBox="0 0 1600 690" role="img" aria-labelledby="title desc">
<title id="title">Modern LLM Notebook — Data-Juicer 数据清洗流程</title>
<desc id="desc">The implemented Ultra-FineWeb pipeline: quality threshold, HTML removal, Unicode repair, whitespace normalization, character-length filtering, score ordering, actual BPE token budgeting, document splitting and EOS packing.</desc>
