<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="770" viewBox="0 0 1600 770" role="img" aria-labelledby="title desc">
<title id="title">Modern LLM Notebook — DotLM 实际数据来源与清洗配方</title>
<desc id="desc">The recorded pretraining pipeline reads Chinese Ultra-FineWeb shards with content, score and source fields. Score values are parsed and filtered outside Data-Juicer, followed in order by clean_html_mapper, fix_unicode_mapper, whitespace_normalization_mapper, and text_length_filter. The cleaned JSONL is score-ordered, BPE-budgeted, split by document and packed as uint16 tokens with EOS boundaries.</desc>
<!-- Original artwork. Shared with the training overview: brand blue/teal, outline icons, horizontal framework and platform strip. -->
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#667085"/></marker></defs>
<rect width="1600" height="770" fill="white"/>
<text x="800" y="61" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="38" font-weight="700" fill="#172033">Modern LLM Notebook</text>
<text x="800" y="102" text-anchor="middle" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="400" fill="#1d6bf3">DotLM 实际数据来源与清洗配方</text>
<rect x="55" y="170" width="300" height="335" fill="#f5f8ff" stroke="none" stroke-width="1.6"/>
<text x="205" y="211" text-anchor="middle" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="600" fill="#172033">预训练数据来源</text>
<text x="205" y="254" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="600" fill="#1d6bf3">Ultra-FineWeb</text>
<text x="205" y="287" text-anchor="middle" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#667085">中文分片 · Parquet</text>
<text x="205" y="329" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#667085">content · score · source</text>
<text x="205" y="377" text-anchor="middle" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="600" fill="#172033">质量分数筛选</text>
<text x="205" y="416" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#667085">mini: score ≥ 0.8</text>
<text x="205" y="447" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#667085">full: score ≥ 0.7</text>
<text x="205" y="482" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#667085">score: string → float</text>
<path d="M359 288H398" stroke="#667085" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="410" y="170" width="1135" height="335" fill="white" stroke="#1d6bf3" stroke-width="1.6"/>
<g transform="translate(551.875 259) scale(0.76)" fill="none" stroke="#1d6bf3" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="-41" y="-32" width="82" height="64" rx="2"/><path d="M-22-12L-34 0L-22 12M22-12L34 0L22 12M9-20L-9 20"/></g>
<text x="551.875" y="325" text-anchor="middle" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="600" fill="#172033">移除 HTML</text>
<text x="551.875" y="370" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#667085">clean_html_mapper</text>
<path d="M605.875 259H775.875" stroke="#667085" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<g transform="translate(835.625 259) scale(0.76)" fill="none" stroke="#1d6bf3" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M-34 28L-12-30L10 28M-25 6H1M17-21H40M29-32V-9M9 33L19 43L39 19"/></g>
<text x="835.625" y="325" text-anchor="middle" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="600" fill="#172033">修复 Unicode</text>
<text x="835.625" y="370" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#667085">fix_unicode_mapper</text>
<path d="M889.625 259H1059.625" stroke="#667085" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<g transform="translate(1119.375 259) scale(0.76)" fill="none" stroke="#1d6bf3" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M-39-28H-7M9-28H39M-39-6H-17M-3-6H12M27-6H39M-39 30H39M-10 7L0 18L10 7M0 0V18"/></g>
<text x="1119.375" y="325" text-anchor="middle" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="600" fill="#172033">规范空白</text>
<text x="1119.375" y="370" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#667085">whitespace_</text>
<text x="1119.375" y="396" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#667085">normalization_mapper</text>
<path d="M1173.375 259H1343.375" stroke="#667085" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<g transform="translate(1403.125 259) scale(0.76)" fill="none" stroke="#1d6bf3" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M-43-31H43L12 6V37L-12 26V6ZM-31-17H31"/></g>
<text x="1403.125" y="325" text-anchor="middle" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="600" fill="#172033">长度过滤</text>
<text x="1403.125" y="370" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#667085">text_length_filter</text>
<text x="1403.125" y="432" text-anchor="middle" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#667085">100–8,000 字符</text>
<rect x="410" y="505" width="1135" height="39" fill="#1d6bf3" stroke="none" stroke-width="1.6"/>
<text x="977.5" y="532" text-anchor="middle" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="600" fill="#fff">Data-Juicer → 清洗后 JSONL</text>
<path d="M977.5 544V580" stroke="#667085" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
<text x="800" y="604" text-anchor="middle" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#667085">后续训练数据准备</text>
<rect x="55" y="623" width="1490" height="88" fill="#f5f7fa" stroke="none" stroke-width="1.6"/>
<text x="241.25" y="657" text-anchor="middle" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="600" fill="#172033">质量排序</text>
<text x="241.25" y="691" text-anchor="middle" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#667085">按分数降序</text>
<path d="M371.25 661H484.25" stroke="#667085" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="613.75" y="657" text-anchor="middle" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="600" fill="#172033">真实 BPE 预算</text>
<text x="613.75" y="691" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#667085">mini 270M · full 2.21B</text>
<path d="M743.75 661H856.75" stroke="#667085" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="986.25" y="657" text-anchor="middle" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="600" fill="#172033">按文档划分</text>
<text x="986.25" y="691" text-anchor="middle" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#667085">训练 / 验证</text>
<path d="M1116.25 661H1229.25" stroke="#667085" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="1358.75" y="657" text-anchor="middle" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="600" fill="#172033">EOS 边界与打包</text>
<text x="1358.75" y="691" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#667085">uint16 token stream</text>
<text x="800" y="750" text-anchor="middle" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#667085">产物：train.bin · val.bin · val.jsonl · manifest</text>
