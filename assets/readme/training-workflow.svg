<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="660" viewBox="0 0 1600 660" role="img" aria-labelledby="title desc">
<title id="title">Modern LLM Notebook — From text to a trained model</title>
<desc id="desc">Course overview: data preparation, BPE tokenizer training, 64M-class Dense pretraining, supervised fine-tuning, and evaluation and inference. Learning extensions cover MoE, tool calling, LoRA and merging, alignment and distillation. This is a learning path; implementation status and the reported run using an existing tokenizer are documented in the README.</desc>
