<title id="title">Modern LLM Notebook — Data sources &amp; processing operators</title>
<desc id="desc">Course workflow: web, encyclopedia, books, code, papers and math corpora; example Data-Juicer operators for text cleaning, quality filtering, privacy cleaning and deduplication; then mixing and tokenization. This is the teaching workflow, not the complete operator recipe used in the recorded DotLM run.</desc>
