<title id="title">Modern LLM Notebook — A roadmap for modern LLMs</title>
<desc id="desc">A learning path through foundations, data sourcing, cleaning and synthesis, training and architectures, post-training, inference and evaluation, with frontier and hardware extensions. This is a course map; runnable training status is documented in the README.</desc>
